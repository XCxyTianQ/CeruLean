name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: applyAllPatches + build + 冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # patcher 会用 `git am` 应用特性补丁并**创建提交**，因此必须有提交者身份。
    # 放在 job 级 env：Gradle daemon 在启动时就继承，避免"daemon 持有旧环境"导致的随机失败。
    env:
      GIT_AUTHOR_NAME: CeruLean Build
      GIT_AUTHOR_EMAIL: build@cerulean.local
      GIT_COMMITTER_NAME: CeruLean Build
      GIT_COMMITTER_EMAIL: build@cerulean.local
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Git 身份（patcher 需要；与 job env 双保险）
        run: |
          git config --global user.email "build@cerulean.local"
          git config --global user.name "CeruLean Build"

      - name: 拉取上游 + 应用补丁
        run: ./gradlew applyAllPatches --stacktrace

      - name: 编译
        run: ./gradlew build --stacktrace

      - name: 产出 Paperclip 分发 jar
        run: ./gradlew :cerulean-server:createPaperclipJar --stacktrace

      - name: 收集产物
        id: artifact
        run: |
          set -e
          # 必须选 paperclip 容器 jar：根目录 build/libs 下的聚合 jar 没有 Main-Class，
          # 用它启动会得到 "no main manifest attribute"（实测踩过，且当时被下面的 || 吞掉了）
          jar=$(ls cerulean-server/build/libs/*paperclip*.jar | head -1)
          [ -f "$jar" ] || { echo "找不到 paperclip jar"; exit 1; }
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          ls -l "$jar"

      - name: 上传分发 jar
        uses: actions/upload-artifact@v4
        with:
          name: cerulean-jar
          path: ${{ steps.artifact.outputs.jar }}
          if-no-files-found: error

      - name: 验收套件（L0 基座活性 / L1 可观测面 / L2 用例）
        env:
          CERULEAN_EULA: "TRUE"
          CERULEAN_EXPECT_MC: "26.3"
        run: |
          # 基座换成 Folia 26.3 之后，**旧的 Paper 冒烟基线不再适用**：
          #   * run-smoke.sh 的旧基线在 Folia 上 PASS 2/FAIL 6 属预期（见 docs/12），不要试图跑绿；
          #   * c3-config-acceptance.sh / b2-ownership-acceptance.sh 测的是**已被收缩掉的自研区域化运行时**
          #     （B1/B2/C2），在本基座上必然失败。
          # 回归闸门改为我们自己的分层套件：
          #   L0 基座活性 → L1 可观测面（区域级 TPS、我们自己的诊断命令、watchdog 无停摆告警）
          #   → L2 用例（scoreboard/clone、EXP 链、并发压力、存档往返）
          # 子项退出码 2 = 环境前提不满足（未验证），既不算通过也不算失败，汇总里单列。
          python3 tools/smoke/run_suite.py --jar "${{ steps.artifact.outputs.jar }}"

      - name: 上传冒烟报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            smoke-suite/
            smoke-exp/
            smoke-persist/
          if-no-files-found: warn
