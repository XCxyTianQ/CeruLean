name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: applyAllPatches + build + 冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # patcher 会用 `git am` 应用特性补丁并**创建提交**，因此必须有提交者身份。
    # 放在 job 级 env：Gradle daemon 在启动时就继承，避免"daemon 持有旧环境"导致的随机失败。
    env:
      GIT_AUTHOR_NAME: CeruLean Build
      GIT_AUTHOR_EMAIL: build@cerulean.local
      GIT_COMMITTER_NAME: CeruLean Build
      GIT_COMMITTER_EMAIL: build@cerulean.local
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Git 身份（patcher 需要；与 job env 双保险）
        run: |
          git config --global user.email "build@cerulean.local"
          git config --global user.name "CeruLean Build"

      - name: 拉取上游 + 应用补丁
        run: ./gradlew applyAllPatches --stacktrace

      - name: 编译
        run: ./gradlew build --stacktrace

      - name: 产出 Paperclip 分发 jar
        run: ./gradlew :cerulean-server:createPaperclipJar --stacktrace

      - name: 收集产物
        id: artifact
        run: |
          set -e
          # 必须选 paperclip 容器 jar：根目录 build/libs 下的聚合 jar 没有 Main-Class，
          # 用它启动会得到 "no main manifest attribute"（实测踩过，且当时被下面的 || 吞掉了）
          jar=$(ls cerulean-server/build/libs/*paperclip*.jar | head -1)
          [ -f "$jar" ] || { echo "找不到 paperclip jar"; exit 1; }
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          ls -l "$jar"

      - name: 上传分发 jar
        uses: actions/upload-artifact@v4
        with:
          name: cerulean-jar
          path: ${{ steps.artifact.outputs.jar }}
          if-no-files-found: error

      - name: 冒烟测试（语义基线）
        env:
          CERULEAN_EULA: "TRUE"
          CERULEAN_EXPECT_MC: "26.3"
        run: |
          chmod +x tools/smoke/*.sh
          # 不吞失败：冒烟失败必须让 job 变红（曾经用 `|| echo SMOKE_FAILED=1`，
          # 而全流程无人检查该变量，导致 CI 假绿）
          tools/smoke/run-smoke.sh "${{ steps.artifact.outputs.jar }}" ./smoke-report

      - name: 配置验收（cerulean-regions 是否真的驱动内核）
        env:
          CERULEAN_EULA: "TRUE"
          CERULEAN_EXPECT_MC: "26.3"
        run: |
          # 跑两轮：默认 merge-radius=2，再改成 1，比较实测的合并阈值（必须左移 1 段）。
          # 这是"配置被忽略"这类问题的唯一可靠检出方式。
          chmod +x tools/smoke/*.sh
          tools/smoke/c3-config-acceptance.sh "${{ steps.artifact.outputs.jar }}" ./smoke-config-report

      - name: 上传冒烟报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            smoke-report/
            smoke-config-report/
          if-no-files-found: warn
