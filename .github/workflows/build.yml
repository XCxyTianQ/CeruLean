name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: applyAllPatches + build + 冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Git 身份（patcher 需要）
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: 拉取上游 + 应用补丁
        run: ./gradlew applyAllPatches --stacktrace

      - name: 编译
        run: ./gradlew build --stacktrace

      - name: 产出 Paperclip 分发 jar
        run: ./gradlew :cerulean-server:createPaperclipJar --stacktrace

      - name: 收集产物
        id: artifact
        run: |
          set -e
          jar=$(find . -name "*paperclip*.jar" -o -name "cerulean-*.jar" | grep -v sources | head -1)
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          ls -l "$jar"

      - name: 上传分发 jar
        uses: actions/upload-artifact@v4
        with:
          name: cerulean-jar
          path: ${{ steps.artifact.outputs.jar }}
          if-no-files-found: error

      - name: 冒烟测试（语义基线）
        env:
          CERULEAN_EULA: "TRUE"
          CERULEAN_EXPECT_MC: "26.3"
        run: |
          chmod +x tools/smoke/*.sh
          tools/smoke/run-smoke.sh "${{ steps.artifact.outputs.jar }}" ./smoke-report || echo "SMOKE_FAILED=1" >> "$GITHUB_ENV"

      - name: 上传冒烟报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report/
          if-no-files-found: warn
