name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: applyAllPatches + build + 冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # patcher 会用 `git am` 应用特性补丁并**创建提交**，因此必须有提交者身份。
    # 放在 job 级 env：Gradle daemon 在启动时就继承，避免"daemon 持有旧环境"导致的随机失败。
    env:
      GIT_AUTHOR_NAME: CeruLean Build
      GIT_AUTHOR_EMAIL: build@cerulean.local
      GIT_COMMITTER_NAME: CeruLean Build
      GIT_COMMITTER_EMAIL: build@cerulean.local
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Git 身份（patcher 需要；与 job env 双保险）
        run: |
          git config --global user.email "build@cerulean.local"
          git config --global user.name "CeruLean Build"

      - name: 拉取上游 + 应用补丁
        run: ./gradlew applyAllPatches --stacktrace

      - name: 编译
        run: ./gradlew build --stacktrace

      - name: 产出 Paperclip 分发 jar
        run: ./gradlew :cerulean-server:createPaperclipJar --stacktrace

      - name: 收集产物
        id: artifact
        run: |
          set -e
          # 必须选 paperclip 容器 jar：根目录 build/libs 下的聚合 jar 没有 Main-Class，
          # 用它启动会得到 "no main manifest attribute"（实测踩过，且当时被下面的 || 吞掉了）
          jar=$(ls cerulean-server/build/libs/*paperclip*.jar | head -1)
          [ -f "$jar" ] || { echo "找不到 paperclip jar"; exit 1; }
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          ls -l "$jar"

      - name: 校验产物版本串
        run: |
          set -e
          jar=$(ls cerulean-server/build/libs/*paperclip*.jar | head -1)
          case "$jar" in
            *"-SNAPSHOT.jar") echo "产物：$jar" ;;
            *) echo "::error::产物名不含 -SNAPSHOT（channel 与版本串不一致）：$jar"; exit 1 ;;
          esac

      - name: 上传分发 jar
        uses: actions/upload-artifact@v4
        with:
          name: cerulean-jar
          path: ${{ steps.artifact.outputs.jar }}
          if-no-files-found: error

      # ⚠️ CI **只做构建**，不跑验收套件。原因（2026-10-16 实测）：
      #   tools/smoke/run_suite.py 的 L2 用例有**环境前提**——需要 Folia 调度器 ≥2 个线程、
      #   以及 ≥2 个区域。GitHub 的小 runner 上这些前提不成立，L2 的探针会按设计自跳(SKIP)
      #   或报 FAIL（如 "调度器线程数 < 2"），于是闸门变成噪声。
      #   验收套件保留为**本地闸门**（发布前在开发机上跑），见 docs/18。

